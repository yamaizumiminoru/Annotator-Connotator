name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: node scripts/verify_language_catalog.mjs
